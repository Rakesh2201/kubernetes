apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-deployment
spec:
  replicas: {{ .Values.app3.replicaCount }}
  selector:
    matchLabels:
      app: app3
  template:
    metadata:
      labels:
        app: app3
    spec:
      containers:
        - name: app3
          image: "{{ .Values.app3.image.repository }}:{{ .Values.app3.image.tag }}"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: app3-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: app3-html
          configMap:
            name: app3-html
