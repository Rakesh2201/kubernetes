apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-deployment
spec:
  replicas: {{ (index .Values.applications 2).replicaCount }}
  selector:
    matchLabels:
      app: app3
  template:
    metadata:
      labels:
        app: app3
    spec:
      containers:
        - name: app3
          image: "{{ (index .Values.applications 2).image.repository }}:{{ (index .Values.applications 2).image.tag }}"
          ports:
            - containerPort: {{ (index .Values.applications 2).containerPort }}
          volumeMounts:
            - name: app3-html
              mountPath: /usr/local/tomcat/webapps/ROOT/index.html
              subPath: index.html
      volumes:
        - name: app3-html
          configMap:
            name: app3-html
