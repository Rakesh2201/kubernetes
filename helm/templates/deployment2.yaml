apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-deployment
spec:
  replicas: {{ (index .Values.applications 1).replicaCount }}
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: "{{ (index .Values.applications 1).image.repository }}:{{ (index .Values.applications 1).image.tag }}"
          ports:
            - containerPort: {{ (index .Values.applications 1).containerPort }}
          volumeMounts:
            - name: app2-html
              mountPath: /usr/local/apache2/htdocs/index.html
              subPath: index.html
      volumes:
        - name: app2-html
          configMap:
            name: app2-html
