apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-deployment
spec:
  replicas: {{ .Values.app2.replicaCount }}
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: "{{ .Values.app2.image.repository }}:{{ .Values.app2.image.tag }}"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: app2-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: app2-html
          configMap:
            name: app2-html
