{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /app1
            pathType: Prefix
            backend:
              service:
                name: app1-service
                port:
                  number: {{ .Values.app1.service.port }}

          - path: /app2
            pathType: Prefix
            backend:
              service:
                name: app2-service
                port:
                  number: {{ .Values.app2.service.port }}

          - path: /app3
            pathType: Prefix
            backend:
              service:
                name: app3-service
                port:
                  number: {{ .Values.app3.service.port }}
{{- end }}
