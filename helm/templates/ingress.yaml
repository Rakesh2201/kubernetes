{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /thalapathy
            pathType: ImplementationSpecific
            backend:
              service:
                name: app1-service
                port:
                  number: {{ (index .Values.applications 0).service.port }}

          - path: /darling
            pathType: ImplementationSpecific
            backend:
              service:
                name: app2-service
                port:
                  number: {{ (index .Values.applications 1).service.port }}

          - path: /superstar
            pathType: ImplementationSpecific
            backend:
              service:
                name: app3-service
                port:
                  number: {{ (index .Values.applications 2).service.port }}
{{- end }}
