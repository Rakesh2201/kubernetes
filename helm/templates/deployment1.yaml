apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-deployment
spec:
  replicas: {{ (index .Values.applications 0).replicaCount }}
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: app1
          image: "{{ (index .Values.applications 0).image.repository }}:{{ (index .Values.applications 0).image.tag }}"
          ports:
            - containerPort: {{ (index .Values.applications 0).containerPort }}
          volumeMounts:
            - name: app1-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: app1-html
          configMap:
            name: app1-html
