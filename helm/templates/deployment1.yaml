apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-deployment
spec:
  replicas: {{ .Values.app1.replicaCount }}
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: app1
          image: "{{ .Values.app1.image.repository }}:{{ .Values.app1.image.tag }}"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: app1-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: app1-html
          configMap:
            name: app1-html
