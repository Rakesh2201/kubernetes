applications:
  - name: app1
    replicaCount: 1
    image:
      repository: nginx
      tag: "latest"
    containerPort: 80
    service:
      port: 80
      targetPort: 80
    indexHtml: |
      <!DOCTYPE html>
      <html>
      <body>
        <h1>Welcome to Application 1 - NGINX</h1>
      </body>
      </html>

  - name: app2
    replicaCount: 1
    image:
      repository: httpd
      tag: "latest"
    containerPort: 80
    service:
      port: 80
      targetPort: 80
    indexHtml: |
      <!DOCTYPE html>
      <html>
      <body>
        <h1>Welcome to Application 2 - Apache HTTPD</h1>
      </body>
      </html>

  - name: app3
    replicaCount: 1
    image:
      repository: tomcat
      tag: "latest"
    containerPort: 8080
    service:
      port: 80
      targetPort: 8080
    indexHtml: |
      <!DOCTYPE html>
      <html>
      <body>
        <h1>Welcome to Application 3 - Tomcat</h1>
      </body>
      </html>

ingress:
  enabled: true
  className: nginx
  host: a34bb12f41d7947f4b682eb653ce230d-1064653258.ap-south-1.elb.amazonaws.com
